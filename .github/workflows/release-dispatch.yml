name: Dispatch Release to juno-std

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to redispatch
        required: true
        type: string
      is_draft:
        description: Mark the release as a draft
        required: true
        default: false
        type: boolean
      is_prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean

env:
  JUNO_REPO: "https://github.com/CosmosContracts/juno.git"
  JUNO_DIR: "proto"
  # Keep these selected proto revisions aligned with the dependency graph in go.mod.
  # .github/scripts/release-dispatch.test.js enforces that relationship offline.
  COSMOS_SDK_REPO: "https://github.com/cosmos/cosmos-sdk.git"
  COSMOS_SDK_REV: "v0.53.7"
  COSMOS_SDK_DIR: "proto"
  WASMD_REPO: "https://github.com/CosmWasm/wasmd.git"
  WASMD_REV: "v0.61.11"
  WASMD_DIR: "proto"
  COMETBFT_REPO: "https://github.com/cometbft/cometbft.git"
  COMETBFT_REV: "v0.38.23"
  COMETBFT_DIR: "proto"
  IBC_GO_REPO: "https://github.com/cosmos/ibc-go.git"
  IBC_GO_REV: "v10.6.0"
  IBC_GO_DIR: "proto"
  ICS23_REPO: "https://github.com/cosmos/ics23.git"
  ICS23_REV: "go/v0.11.0"
  ICS23_DIR: "proto"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload builder
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Dispatch release event
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const { buildDispatchRequest } = require('./.github/scripts/release-dispatch');

            let request;
            try {
              request = buildDispatchRequest(context.payload, process.env);
            } catch (error) {
              core.setFailed(error.message);
              return;
            }

            core.info(`Dispatching to ${request.owner}/${request.repo} with payload: ${JSON.stringify(request.client_payload)}`);
            await github.rest.repos.createDispatchEvent(request);
            core.info('Repository dispatch event sent successfully.');
