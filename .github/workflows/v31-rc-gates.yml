name: v31 hosted RC gates

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full candidate commit SHA in this repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v31-hosted-rc-${{ inputs.commit }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.25.10
  TAR_PATH: /tmp/juno-v31-rc-image.tar
  ARTIFACT_NAME: juno-v31-rc-image
  CANDIDATE: ${{ inputs.commit }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build candidate image without publication
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          tags: ghcr.io/cosmoscontracts/juno:local
          outputs: type=docker,dest=${{ env.TAR_PATH }}
          provenance: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.TAR_PATH }}
          retention-days: 1
          if-no-files-found: error

  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: [ictest-node, ictest-upgrade, ictest-dao-dao]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Candidate-controlled tests must not be able to persist poisoned Go
          # build or module caches into later repository workflows.
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp
      - name: Load exact candidate image
        run: |
          set -euo pipefail
          docker image load --input "$TAR_PATH"
          test "$(docker image inspect ghcr.io/cosmoscontracts/juno:local --format '{{.Id}}')" != ""
      - name: Run ${{ matrix.gate }} once
        run: make ${{ matrix.gate }}
